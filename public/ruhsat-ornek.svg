<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Paper Texture & Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf7f9" />
      <stop offset="50%" stop-color="#e3f2f5" />
      <stop offset="100%" stop-color="#d4ebef" />
    </linearGradient>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0,20 Q 10,0 20,20 T 40,20" fill="none" stroke="#b2d8e0" stroke-width="0.75" opacity="0.45"/>
      <path d="M 0,10 Q 10,30 20,10 T 40,10" fill="none" stroke="#99ccd6" stroke-width="0.5" opacity="0.35"/>
      <circle cx="20" cy="20" r="15" fill="none" stroke="#c0e2e8" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="paperShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
    <filter id="stampShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#801010" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="#1e242b" />

  <!-- Main Scanned Document with Border & Guilloche -->
  <g filter="url(#paperShadow)">
    <rect x="50" y="40" width="1100" height="720" rx="16" fill="url(#paperGrad)" stroke="#89b7c2" stroke-width="2"/>
    <rect x="50" y="40" width="1100" height="720" rx="16" fill="url(#guilloche)" />
    <!-- Fold Crease Line in Middle -->
    <line x1="600" y1="40" x2="600" y2="760" stroke="#9cbac2" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
    <line x1="599" y1="40" x2="599" y2="760" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ==================== LEFT PAGE (ARAÇ TESCİL BELGESİ) ==================== -->
  <g transform="translate(70, 60)">
    <!-- Header -->
    <rect x="10" y="10" width="490" height="65" rx="6" fill="#cce8ee" stroke="#7baab5" stroke-width="1"/>
    <text x="255" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#003366" text-anchor="middle" letter-spacing="1.5">T.C. EMNİYET GENEL MÜDÜRLÜĞÜ</text>
    <text x="255" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#003366" text-anchor="middle" letter-spacing="1">TÜRKİYE NOTERLER BİRLİĞİ</text>
    <text x="255" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="900" fill="#8b0000" text-anchor="middle" letter-spacing="2">ARAÇ TESCİL BELGESİ</text>

    <!-- Serial Number Top Right -->
    <rect x="360" y="80" width="140" height="24" rx="4" fill="#ffffff" stroke="#e63946" stroke-width="1.2"/>
    <text x="370" y="96" font-family="Courier, monospace" font-size="13" font-weight="bold" fill="#d90429" letter-spacing="2">GI 431226</text>

    <!-- (A) Plaka Box -->
    <rect x="10" y="80" width="220" height="42" rx="6" fill="#ffffff" stroke="#1d3557" stroke-width="1.5"/>
    <rect x="10" y="80" width="32" height="42" fill="#003399" rx="4"/>
    <text x="26" y="106" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">TR</text>
    <text x="135" y="110" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="3">34 HL 4830</text>

    <!-- Left Form Grid -->
    <g transform="translate(10, 130)" font-family="Arial, sans-serif" font-size="9" fill="#1d3557">
      <!-- (B) İlk Tescil Tarihi -->
      <rect x="0" y="0" width="490" height="28" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="14" font-weight="bold">(B) İLK TESCİL TARİHİ:</text>
      <text x="150" y="15" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">15.01.2024</text>
      <text x="260" y="14" font-weight="bold">TESCİL SIRA NO:</text>
      <text x="370" y="15" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">2024/098412</text>

      <!-- (D.1) Marka & (D.2) Tip -->
      <rect x="0" y="32" width="490" height="28" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="46" font-weight="bold">(D.1) MARKA:</text>
      <text x="110" y="47" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">VOLVO</text>
      <text x="240" y="46" font-weight="bold">(D.2) TİPİ / MODELİ:</text>
      <text x="360" y="47" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">EX30 PLUS</text>

      <!-- (D.3) Ticari Adı -->
      <rect x="0" y="64" width="490" height="28" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="78" font-weight="bold">(D.3) TİCARİ ADI:</text>
      <text x="110" y="79" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">EX30 CROSSOVER ELECTRIC</text>

      <!-- (E) Şasi No -->
      <rect x="0" y="96" width="490" height="28" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="110" font-weight="bold">(E) ŞASİ NUMARASI:</text>
      <text x="130" y="111" font-family="Courier, monospace" font-size="13" font-weight="900" fill="#000" letter-spacing="1">NM426300006Y60210</text>

      <!-- (P.5) Motor No -->
      <rect x="0" y="128" width="490" height="28" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="142" font-weight="bold">(P.5) MOTOR NUMARASI:</text>
      <text x="140" y="143" font-family="Courier, monospace" font-size="13" font-weight="900" fill="#000" letter-spacing="1">463460201136131</text>

      <!-- (P.1) Silindir & (P.2) Motor Gücü -->
      <rect x="0" y="160" width="490" height="28" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="174" font-weight="bold">(P.1) SİLİNDİR HACMİ:</text>
      <text x="130" y="175" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">0 cm³</text>
      <text x="240" y="174" font-weight="bold">(P.2) MOTOR GÜCÜ:</text>
      <text x="360" y="175" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">200 kW (272 BG)</text>

      <!-- (P.3) Yakıt Cinsi & (S.1) Koltuk -->
      <rect x="0" y="192" width="490" height="28" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="206" font-weight="bold">(P.3) YAKIT CİNSİ:</text>
      <text x="110" y="207" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">ELEKTRİK</text>
      <text x="240" y="206" font-weight="bold">(S.1) KOLTUK ADEDİ:</text>
      <text x="360" y="207" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">5 KİŞİLİK</text>

      <!-- (R) Renk & (J) Araç Sınıfı -->
      <rect x="0" y="224" width="490" height="28" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="238" font-weight="bold">(R) RENK:</text>
      <text x="80" y="239" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">GÜMÜŞ GRİ / SİYAH TAVAN</text>
      <text x="280" y="238" font-weight="bold">(J) ARAÇ SINIFI:</text>
      <text x="380" y="239" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">M1 (OTOMOBİL)</text>
    </g>

    <!-- Official Red Stamp / Mühür -->
    <g transform="translate(370, 420)" filter="url(#stampShadow)">
      <circle cx="50" cy="50" r="45" fill="none" stroke="#b7094c" stroke-width="2.5" stroke-dasharray="8 2" opacity="0.85"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="#b7094c" stroke-width="1" opacity="0.7"/>
      <text x="50" y="38" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#b7094c" text-anchor="middle" transform="rotate(-15 50 50)">T.C. İSTANBUL 34. NOTERLİĞİ</text>
      <text x="50" y="55" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#b7094c" text-anchor="middle" transform="rotate(-15 50 50)">ONAYLANDI</text>
      <text x="50" y="68" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#b7094c" text-anchor="middle" transform="rotate(-15 50 50)">15.01.2024</text>
    </g>

    <!-- Bottom Barcode -->
    <g transform="translate(10, 600)">
      <rect x="0" y="0" width="300" height="40" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8"/>
      <!-- Simulated Barcode Lines -->
      <line x1="20" y1="5" x2="20" y2="35" stroke="#111" stroke-width="2"/>
      <line x1="25" y1="5" x2="25" y2="35" stroke="#111" stroke-width="1"/>
      <line x1="30" y1="5" x2="30" y2="35" stroke="#111" stroke-width="3"/>
      <line x1="38" y1="5" x2="38" y2="35" stroke="#111" stroke-width="1.5"/>
      <line x1="45" y1="5" x2="45" y2="35" stroke="#111" stroke-width="4"/>
      <line x1="54" y1="5" x2="54" y2="35" stroke="#111" stroke-width="2"/>
      <line x1="62" y1="5" x2="62" y2="35" stroke="#111" stroke-width="1"/>
      <line x1="70" y1="5" x2="70" y2="35" stroke="#111" stroke-width="3"/>
      <line x1="80" y1="5" x2="80" y2="35" stroke="#111" stroke-width="1.5"/>
      <line x1="90" y1="5" x2="90" y2="35" stroke="#111" stroke-width="3"/>
      <line x1="105" y1="5" x2="105" y2="35" stroke="#111" stroke-width="2"/>
      <line x1="115" y1="5" x2="115" y2="35" stroke="#111" stroke-width="4"/>
      <line x1="128" y1="5" x2="128" y2="35" stroke="#111" stroke-width="1"/>
      <line x1="140" y1="5" x2="140" y2="35" stroke="#111" stroke-width="3"/>
      <line x1="155" y1="5" x2="155" y2="35" stroke="#111" stroke-width="2"/>
      <line x1="170" y1="5" x2="170" y2="35" stroke="#111" stroke-width="3.5"/>
      <line x1="185" y1="5" x2="185" y2="35" stroke="#111" stroke-width="1"/>
      <line x1="200" y1="5" x2="200" y2="35" stroke="#111" stroke-width="4"/>
      <line x1="215" y1="5" x2="215" y2="35" stroke="#111" stroke-width="2"/>
      <line x1="230" y1="5" x2="230" y2="35" stroke="#111" stroke-width="1.5"/>
      <line x1="245" y1="5" x2="245" y2="35" stroke="#111" stroke-width="3"/>
      <line x1="260" y1="5" x2="260" y2="35" stroke="#111" stroke-width="2"/>
      <line x1="275" y1="5" x2="275" y2="35" stroke="#111" stroke-width="2.5"/>
      <text x="150" y="47" font-family="Courier, monospace" font-size="8" fill="#555" text-anchor="middle">TR34-098412-GI431226</text>
    </g>
  </g>

  <!-- ==================== RIGHT PAGE (SAHİPLİK & MUAYENE BİLGİLERİ) ==================== -->
  <g transform="translate(620, 60)">
    <!-- Header -->
    <rect x="10" y="10" width="490" height="45" rx="6" fill="#cce8ee" stroke="#7baab5" stroke-width="1"/>
    <text x="255" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" fill="#003366" text-anchor="middle" letter-spacing="1.5">ARAÇ SAHİBİNİN KİMLİK / UNVAN BİLGİLERİ</text>

    <!-- (C.1.1) Sahip Bilgisi -->
    <g transform="translate(10, 70)" font-family="Arial, sans-serif" font-size="9" fill="#1d3557">
      <rect x="0" y="0" width="490" height="35" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="14" font-weight="bold">(C.1.1) SOYADI / TİCARET UNVANI:</text>
      <text x="8" y="28" font-family="Courier, monospace" font-size="12" font-weight="900" fill="#000">HİLAL OFİS VE BORDRO YÖNETİM HİZMETLERİ A.Ş.</text>

      <rect x="0" y="42" width="490" height="30" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="56" font-weight="bold">(C.1.2) VERGİ / T.C. KİMLİK NO:</text>
      <text x="180" y="58" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#000">4630891244 (BEŞİKTAŞ V.D.)</text>

      <rect x="0" y="80" width="490" height="42" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="94" font-weight="bold">(C.1.3) ADRES:</text>
      <text x="8" y="110" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#000">BÜYÜKDERE CAD. NO:195 LEVENT / İSTANBUL</text>

      <!-- Hak Mahrumiyeti -->
      <rect x="0" y="130" width="490" height="28" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="8" y="144" font-weight="bold">HAK MAHRUMİYETİ (REHİN / HACİZ):</text>
      <text x="220" y="145" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#2a9d8f">YOKTUR (TEMİZ)</text>
    </g>

    <!-- Muayene Onay Alanı -->
    <g transform="translate(10, 240)">
      <rect x="0" y="0" width="490" height="190" rx="6" fill="#ffffff" stroke="#7baab5" stroke-width="1" opacity="0.95"/>
      <rect x="0" y="0" width="490" height="25" fill="#cce8ee" rx="5"/>
      <text x="245" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#003366" text-anchor="middle">ARAÇ MUAYENE BİLGİLERİ (TÜVTÜRK)</text>

      <!-- Muayene Satırı 1 -->
      <rect x="15" y="35" width="460" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#64748b">MUAYENE GEÇERLİLİK TARİHİ</text>
      <text x="25" y="66" font-family="Courier, monospace" font-size="13" font-weight="bold" fill="#0f172a">18.06.2026</text>
      <text x="260" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#64748b">İSTASYON / SONUÇ</text>
      <text x="260" y="66" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#059669">İST-MASLAK / KUSURSUZ GEÇTİ</text>

      <!-- Hologram Seal Simulation -->
      <g transform="translate(195, 90)">
        <rect x="0" y="0" width="100" height="70" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="50" cy="35" r="24" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 2"/>
        <text x="50" y="32" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#0369a1" text-anchor="middle">TÜVTÜRK</text>
        <text x="50" y="44" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#0284c7" text-anchor="middle">HOLOGRAM</text>
      </g>
    </g>

    <!-- Signatures & Authority -->
    <g transform="translate(10, 445)">
      <rect x="0" y="0" width="490" height="70" fill="#ffffff" stroke="#9bbdc6" stroke-width="0.8" opacity="0.9"/>
      <text x="120" y="20" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1d3557" text-anchor="middle">TESCİLİ YAPAN NOTERLİK KAŞE / İMZA</text>
      <!-- Simulated Signature -->
      <path d="M 60,45 Q 90,25 120,48 T 160,35 T 180,50" fill="none" stroke="#003399" stroke-width="2" opacity="0.8"/>

      <line x1="245" y1="5" x2="245" y2="65" stroke="#cbd5e1" stroke-width="1"/>

      <text x="365" y="20" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1d3557" text-anchor="middle">TESCİL BELGESİ BASIM TARİHİ</text>
      <text x="365" y="45" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">15.01.2024 - 11:42:08</text>
    </g>
  </g>
</svg>
